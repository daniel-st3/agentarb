name: SignalForge verification
on:
  push:
    branches: ['codex/**']
  pull_request:
    paths: ['apps/signalforge/**', '.github/workflows/signalforge.yml']
permissions:
  contents: read
concurrency:
  group: signalforge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/signalforge
    env:
      CACHE_MODE: memory
      DISCOVERY_MODE: offline
      ENABLE_DEMO_DATA: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/signalforge/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: npm run test:real-ui
      - run: npm audit
