 <g fill="#f1eee6" font-family="Georgia,serif"><text x="64" y="75" font-size="42">SignalForge</text><text x="64" y="122" font-size="24">Intelligence before execution.</text></g>
 <g fill="#aeb0bb" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.6"><text x="904" y="75">OBJECTIVES → ROUTE CONTRACTS</text><text x="904" y="101">ARCHITECTURE / 01</text></g>
