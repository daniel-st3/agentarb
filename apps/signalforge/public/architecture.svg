  <text x="878" y="431">Deterministic Planner</text><text x="416" y="431">ExecutionRouteContract</text><text x="64" y="431">External Client Agent</text>
 </g>
 <g fill="#aeb0bb" font-family="Arial,sans-serif" font-size="16">
  <text x="64" y="281">Human or calling agent</text><text x="64" y="307">Objective · hard budget · policy</text>
  <text x="420" y="281">Groq or local fallback</text><text x="420" y="307">Capabilities · dependencies · constraints</text>
  <text x="758" y="281">Public metadata only</text><text x="758" y="307">Live / cached / seeded provenance</text>
  <text x="878" y="462">Budget · coverage · verification</text><text x="878" y="488">Ordered route · explicit rejections</text>
  <text x="416" y="462">REST + MCP planning interface</text><text x="416" y="488">A2A-style discovery metadata</text>
  <text x="64" y="462">Validate → accept or refuse</text><text x="64" y="488">Local append-only receipt only</text>
 </g>
