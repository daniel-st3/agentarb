 <g fill="#c9cbc5" font-family="ui-monospace,monospace" font-size="13"><text x="91" y="570">STOP / execution_not_enabled</text><text x="678" y="570">Observed options ≠ executed services</text></g>
 <g fill="#e3e0d9" font-family="ui-monospace,monospace" font-size="14" letter-spacing="1.2"><text x="64" y="691">NO PAYMENTS</text><text x="340" y="691">NO MARKETPLACE WRITES</text><text x="768" y="691">NO EXECUTION</text></g>
 <text x="64" y="729" font-family="Arial,sans-serif" font-size="13" fill="#aeb0bb">A planning artifact—not authorization to act. Selected providers are simulated; catalog observations are informational.</text>
