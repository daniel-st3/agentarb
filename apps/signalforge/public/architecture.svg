<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
 <title id="title">SignalForge — intelligence before execution</title>
 <desc id="desc">Human objectives and REST or MCP callers enter objective decomposition, catalog intelligence and a deterministic planner. A route contract is inspected by a separate local client. No payments, marketplace writes or service execution occur.</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#a4a7bf"/></marker></defs>
